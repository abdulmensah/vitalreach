name: Deploy production container
on:
  workflow_dispatch:
    inputs:
      image_run_id:
        description: Successful main-release Build and publish container run ID
        required: true
        type: string
      qa_verified:
        description: I verified this release in QA including login, uploads and idle/reconnection
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read
concurrency:
  group: vitalreach-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main-release'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://vitalreachhub.com
    steps:
      - name: Verify successful release build
        id: build
        uses: actions/github-script@v8
        env:
          RUN_ID: ${{ inputs.image_run_id }}
          QA_VERIFIED: ${{ inputs.qa_verified }}
        with:
          script: |
            if (process.env.QA_VERIFIED !== 'true') throw new Error('QA acceptance is required');
            if (!/^[1-9][0-9]*$/.test(process.env.RUN_ID)) throw new Error('Invalid run ID');
            const run_id = Number(process.env.RUN_ID);
            if (!Number.isSafeInteger(run_id)) throw new Error('Invalid run ID');
            const {data: run} = await github.rest.actions.getWorkflowRun({...context.repo, run_id});
            if (run.path !== '.github/workflows/container.yml' ||
                run.head_branch !== 'main-release' ||
                run.head_repository?.full_name !== process.env.GITHUB_REPOSITORY ||
                !['push', 'workflow_dispatch'].includes(run.event) ||
                run.conclusion !== 'success' || !/^[0-9a-f]{40}$/.test(run.head_sha))
              throw new Error('Select a successful main-release container publishing run');
            core.setOutput('sha', run.head_sha);
            core.setOutput('run_id', String(run_id));
      - name: Download immutable image record
        uses: actions/download-artifact@v5
        with:
          name: container-image
          run-id: ${{ steps.build.outputs.run_id }}
          github-token: ${{ github.token }}
          path: image-record
      - name: Validate image record
        id: image
        uses: actions/github-script@v8
        env:
          EXPECTED_SHA: ${{ steps.build.outputs.sha }}
        with:
          script: |
            const fs = require('fs');
            const record = JSON.parse(fs.readFileSync('image-record/image.json', 'utf8'));
            const repository = process.env.GITHUB_REPOSITORY.toLowerCase();
            if (repository !== 'abdulmensah/vitalreach' ||
                record.repository !== repository ||
                record.commit !== process.env.EXPECTED_SHA ||
                !/^sha256:[0-9a-f]{64}$/.test(record.digest))
              throw new Error('Image record does not match the approved repository/build');
            core.setOutput('digest', record.digest);
            await core.summary.addHeading('Production image')
              .addCodeBlock('ghcr.io/' + repository + '@' + record.digest).write();
      - name: Deploy through restricted SSH command
        env:
          PROD_HOST: ${{ vars.PROD_HOST }}
          SSH_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$PROD_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          trap 'rm -f ~/.ssh/vitalreach_prod' EXIT
          printf '%s\n' "$SSH_KEY" > ~/.ssh/vitalreach_prod
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/vitalreach_prod ~/.ssh/known_hosts
          ssh -T -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -i ~/.ssh/vitalreach_prod "vitalreach-ci@$PROD_HOST" "deploy $DIGEST"
      - name: Verify public HTTPS
        run: |
          for host in vitalreachhub.com www.vitalreachhub.com; do
            curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors --max-time 15 "https://$host/health"
          done
