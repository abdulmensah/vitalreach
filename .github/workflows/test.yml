name: Deploy develop to test

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vitalreach-test
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment:
      name: test
      url: https://test.vitalreachhub.com
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore and build
        run: |
          dotnet restore --configfile NuGet.Config
          dotnet build --configuration Release --no-restore
      - name: Verify deployment and application
        run: |
          bash -n deploy/server/deploy-test
          python3 tests/deploy_prod_archive_checks.py deploy/server/deploy-test
          dotnet run --project tests/IntakeChecks --configuration Release
          dotnet run --project tests/CommerceChecks --configuration Release
          dotnet run --project tests/AdminActionChecks --configuration Release
          dotnet run --project tests/ContactChecks --configuration Release
          node tests/connection-checks.cjs
          node tests/admin-confirm-dialog-checks.cjs
      - name: Publish and package
        run: |
          dotnet publish VitalReach.Web.csproj --configuration Release --no-build --output publish
          tar -C publish -czf vitalreach-test-${{ github.sha }}.tar.gz .
      - uses: actions/upload-artifact@v5
        with:
          name: vitalreach-test-${{ github.sha }}
          path: vitalreach-test-${{ github.sha }}.tar.gz
          retention-days: 7
      - name: Prepare pinned SSH connection
        env:
          TEST_SSH_PRIVATE_KEY: ${{ secrets.TEST_SSH_PRIVATE_KEY }}
          TEST_SSH_KNOWN_HOSTS: ${{ secrets.TEST_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$TEST_SSH_PRIVATE_KEY" && test -n "$TEST_SSH_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$TEST_SSH_PRIVATE_KEY" > ~/.ssh/vitalreach_test
          printf '%s\n' "$TEST_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/vitalreach_test ~/.ssh/known_hosts
      - name: Upload and activate test release
        run: |
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/vitalreach_test vitalreach-test-${{ github.sha }}.tar.gz deployer@162.35.104.81:/tmp/
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/vitalreach_test deployer@162.35.104.81 "sudo /opt/vitalreach/bin/deploy-test '${{ github.sha }}'"
      - name: Verify public HTTPS
        run: curl --fail --retry 8 --retry-delay 5 --retry-all-errors --max-time 15 https://test.vitalreachhub.com/health
